<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Baccarat trend board</title>
  <desc id="desc">A full-frame baccarat road showing the real Banker and Player sequences analyzed in the article.</desc>
  <rect width="1200" height="675" fill="#fffaf1"/>
  <g stroke="#171717" stroke-opacity=".13" stroke-width="2">
    <path d="M0 112.5h1200M0 225h1200M0 337.5h1200M0 450h1200M0 562.5h1200"/>
    <path d="M75 0v675M150 0v675M225 0v675M300 0v675M375 0v675M450 0v675M525 0v675M600 0v675M675 0v675M750 0v675M825 0v675M900 0v675M975 0v675M1050 0v675M1125 0v675"/>
  </g>
  <!-- BBBBB and PPPPP: the two highest-agreement continuation trends. -->
  <g fill="#fffaf1" stroke-width="11">
    <g stroke="#a91834">
      <circle cx="38" cy="56" r="27"/><circle cx="38" cy="169" r="27"/><circle cx="38" cy="281" r="27"/><circle cx="38" cy="394" r="27"/><circle cx="38" cy="506" r="27"/>
    </g>
    <g stroke="#2559a7">
      <circle cx="188" cy="56" r="27"/><circle cx="188" cy="169" r="27"/><circle cx="188" cy="281" r="27"/><circle cx="188" cy="394" r="27"/><circle cx="188" cy="506" r="27"/>
    </g>
    <!-- BBBPB -->
    <g stroke="#a91834">
      <circle cx="338" cy="56" r="27"/><circle cx="338" cy="169" r="27"/><circle cx="338" cy="281" r="27"/><circle cx="488" cy="56" r="27"/>
    </g>
    <circle cx="413" cy="56" r="27" stroke="#2559a7"/>
    <!-- PBBBB -->
    <circle cx="638" cy="56" r="27" stroke="#2559a7"/>
    <g stroke="#a91834">
      <circle cx="713" cy="56" r="27"/><circle cx="713" cy="169" r="27"/><circle cx="713" cy="281" r="27"/><circle cx="713" cy="394" r="27"/>
    </g>
    <!-- BBB -->
    <g stroke="#a91834">
      <circle cx="1013" cy="56" r="27"/><circle cx="1013" cy="169" r="27"/><circle cx="1013" cy="281" r="27"/>
    </g>
  </g>
</svg>
